services:
  # PHP 應用程式
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edm-backend-image
    container_name: edm-backend-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      TZ: Asia/Taipei
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # Nginx Web 伺服器
  nginx:
    image: nginx:alpine
    container_name: edm-nginx
    restart: unless-stopped
    ports:
      - "81:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    environment:
      TZ: Asia/Taipei
    depends_on:
      - app
    networks:
      - backend

  # PostgreSQL 16 資料庫
  db:
    image: postgres:16
    container_name: edm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei
    ports:
      # host 5433 → container 5432(5432 留給中台 Middle_Platform)
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  dbdata:
    driver: local
