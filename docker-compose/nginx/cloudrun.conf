# Cloud Run 用 nginx server block。
# 跟 prod.conf 差別:
#   - listen __PORT__:啟動時用 sed 替換成實際 $PORT(Cloud Run 預設 8080)
#   - fastcgi_pass 127.0.0.1:9000(同 container 內 php-fpm,不再是另一個 service)
#   - 拿掉 server_tokens 以外的安全標頭,留給 Cloud Run + 應用層處理
#   - 日誌走 stdout/stderr(Cloud Logging 自動收)

server {
    listen __PORT__ default_server;
    server_name _;
    index index.php;

    root /var/www/public;

    server_tokens off;
    client_max_body_size 10M;

    # 日誌走 stdout/stderr,Cloud Logging 自動收
    error_log  /dev/stderr warn;
    access_log /dev/stdout;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 同 container 的 php-fpm
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # 給 Laravel 自己的 X-Forwarded-Proto / Host(Cloud Run 在 LB 後面)
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60;
    }

    # 禁止存取 dotfile
    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
